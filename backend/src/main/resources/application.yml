spring:
  datasource:
    url: ${DB_URL}              # jdbc:postgresql://<host>:5432/postgres?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5      # Supabase free tier has limited connections
      max-lifetime: 60000
      idle-timeout: 30000
      keepalive-time: 25000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

autocare:
  billing:
    labor-rate-per-hour: 20.00
    default-tax-rate: 8.00
    max-unapproved-discount-pct: 10.00
    coupons:
      SAVE10: 10.00
      WELCOME20: 20.00
      SPRING5: 5.00
  loyalty:
    points-per-currency-unit: 0.1
